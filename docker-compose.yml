services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: braja
      MYSQL_USER: braja_app
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${BRAJA_DB_ROOT_PASSWORD:?Copy .env.example to .env first}
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - braja-mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  braja-mysql:
