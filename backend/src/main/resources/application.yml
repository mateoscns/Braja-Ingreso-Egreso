spring:
  application:
    name: braja-fichaje
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/braja?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:braja_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: 12
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"
    timeout: 30m
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: BRAJA_SESSION
        http-only: true
        secure: ${BRAJA_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
braja:
  scheduling:
    enabled: ${BRAJA_SCHEDULING_ENABLED:true}
  session-cookie-secure: ${BRAJA_SESSION_COOKIE_SECURE:true}
  health-encryption-key-base64: ${BRAJA_HEALTH_ENCRYPTION_KEY_BASE64:}
  push-subscription-encryption-key-base64: ${BRAJA_PUSH_SUBSCRIPTION_ENCRYPTION_KEY_BASE64:}
  vapid-public-key: ${BRAJA_VAPID_PUBLIC_KEY:}
  vapid-private-key: ${BRAJA_VAPID_PRIVATE_KEY:}
  vapid-subject: ${BRAJA_VAPID_SUBJECT:}
  bootstrap-enabled: ${BRAJA_BOOTSTRAP_ENABLED:false}
  bootstrap-dni: ${BRAJA_BOOTSTRAP_DNI:}
  bootstrap-password: ${BRAJA_BOOTSTRAP_PASSWORD:}
  bootstrap-admin-name: ${BRAJA_BOOTSTRAP_ADMIN_NAME:}
  bootstrap-company-name: ${BRAJA_BOOTSTRAP_COMPANY_NAME:}
  bootstrap-site-name: ${BRAJA_BOOTSTRAP_SITE_NAME:}
  bootstrap-time-zone: ${BRAJA_BOOTSTRAP_TIME_ZONE:}
logging:
  level:
    org.springframework.security: WARN
